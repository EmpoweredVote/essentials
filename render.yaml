services:
  - type: web
    name: empowered-essentials
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://accounts-api.empowered.vote
      - key: NODE_VERSION
        value: "20"
      - key: NPM_TOKEN
        sync: false  # Set in Render dashboard — GitHub PAT with read:packages scope
      # Build-time only — both gate the PostHog source-map upload in vite.config.js.
      # Unless BOTH are set the plugin never loads, no release is tagged, and stack
      # traces stay minified (`/assets/index-<hash>.js`), which also splits one bug
      # into a new error-tracking issue per deploy. Never reach the browser bundle.
      - key: POSTHOG_PROJECT_ID
        value: "444996"
      - key: POSTHOG_API_KEY
        sync: false  # Set in Render dashboard — personal API key with error_tracking:write + organization:read
    headers:
      # Public coverage catalog (reciprocal of Treasury Tracker's /treasury/cities) — wildcard CORS.
      - path: /coverage.json
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /coverage.json
        name: Cache-Control
        value: "public, max-age=3600"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
