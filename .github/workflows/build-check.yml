name: Build check

on:
  pull_request:
    branches: [main]
  # Also run on direct pushes to main. Branch protection requires the "build"
  # context, but enforce_admins is false, so an admin pushing straight to main
  # bypasses the PR flow entirely and the required check never reports — GitHub
  # prints 'Required status check "build" is expected' and lets the push through
  # unverified. Direct pushes are the normal workflow on this repo, so without
  # this trigger most commits on main were never built by CI at all.
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Errors block; warnings do not. The remaining react-hooks/exhaustive-deps
      # warnings need individual judgement — mechanically adding deps to those
      # effects is a reliable way to create a render loop — so they stay visible
      # without wedging CI. Keep errors at zero; that is what makes this useful.
      - run: npm run lint
      # Same no-masking reasoning as the test step below: a lint failure must not
      # hide a broken bundle.
      # banners.json is generated from the registry comment block in buildingImages.js.
      # Two other products render these credits as public attribution, so a stale export
      # is a licence problem, not a formatting one -- fail the build rather than drift.
      - run: npm run banners:check
      - run: npm run build
        if: ${{ !cancelled() }}
      # The suite runs even when the build fails. A failing early step otherwise
      # MASKS every step after it, and "did the bundle break, or did behaviour
      # break?" is the first thing you need to know — one answer is a type/import
      # slip, the other is a regression. !cancelled() rather than always() so a
      # cancelled run stops promptly instead of grinding through the suite.
      - run: npm test
        if: ${{ !cancelled() }}
